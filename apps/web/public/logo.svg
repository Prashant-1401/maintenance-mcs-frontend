<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7c2d12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#orangeGrad)" />
  
  <!-- Subtle Internal Highlight Stroke -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="white" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Industrial Gear Outline & Teeth -->
  <g filter="url(#shadow)">
    <!-- Gear Teeth (8-point precision cog) -->
    <path fill="white" fill-rule="evenodd" clip-rule="evenodd" d="
      M30 10h4v3.08a16.1 16.1 0 0 1 4.23 1.75l2.18-2.18 2.83 2.83-2.18 2.18c.72 1.3 1.31 2.73 1.75 4.23H46v4h-3.09a16.1 16.1 0 0 1-1.75 4.23l2.18 2.18-2.83 2.83-2.18-2.18a16.1 16.1 0 0 1-4.23 1.75V38h-4v-3.08a16.1 16.1 0 0 1-4.23-1.75l-2.18 2.18-2.83-2.83 2.18-2.18a16.1 16.1 0 0 1-1.75-4.23H18v-4h3.09c.44-1.5 1.03-2.93 1.75-4.23l-2.18-2.18 2.83-2.83 2.18 2.18A16.1 16.1 0 0 1 30 13.08V10zm2 7a7 7 0 1 0 0 14 7 7 0 0 0 0-14z
    " transform="translate(0, 8)" opacity="0.95" />
    
    <!-- Central Reliability Pulse Wave & M Monogram (Overlay) -->
    <path d="M17 45 L25 27 L32 37 L39 21 L47 45" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M25 27 L32 37 L39 21" stroke="#ffedd5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Reliability Center Apex Node -->
    <circle cx="39" cy="21" r="3" fill="#ffffff" />
    <circle cx="39" cy="21" r="1.5" fill="#ea580c" />
  </g>
</svg>
