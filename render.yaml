services:
  - type: web
    name: mcs-api
    runtime: node
    plan: free
    buildCommand: npm install && cd apps/api && npx prisma generate && npx prisma db push && cd ../.. && npm run build:api
    startCommand: node apps/api/dist/src/main.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mcs-db
          property: connectionString

databases:
  - name: mcs-db
    plan: free
    databaseName: maintenance
    user: maintenance
